[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="agrocybershield"
version="1.0.0"
description="Reproducible FarmSecureNet implementation for cross-domain IoT intrusion detection"
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="AgroCyberShield Authors"}]
dependencies=[
 "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "imbalanced-learn>=0.11",
 "torch>=2.0", "matplotlib>=3.7", "joblib>=1.3", "pyyaml>=6.0", "scipy>=1.10"
]

[project.optional-dependencies]
explain=["shap>=0.44","lime>=0.2.0.1"]
edge=["onnx>=1.14","onnxruntime>=1.16","psutil>=5.9"]
dev=["pytest>=7.4"]

[project.scripts]
agrocyber="agrocybershield.cli:main"

[tool.setuptools.packages.find]
where=["src"]
